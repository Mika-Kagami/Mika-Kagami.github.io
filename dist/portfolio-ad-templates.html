<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рекламные шаблоны | Portfolio Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-glow"></div>
  <main class="shell">
    <header class="navbar">
      <a class="logo" href="index.html">みか かがみ</a>
      <button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav-links">
        <a href="index.html#services">Услуги</a>
        <a href="index.html#portfolio">Портфолио</a>
        <a href="index.html#contact" class="nav-button">Связаться</a>
      </nav>
    </header>

    <section class="gallery-hero">
      <p class="eyebrow">Portfolio Library</p>
      <h1>Рекламные шаблоны</h1>
      <p class="hero-text">Библиотека рекламных макетов и готовых визуальных шаблонов.</p>
      <a class="button ghost" href="index.html#portfolio">Back to portfolio</a>
    </section>

    <section class="section gallery-section" aria-label="Advertising templates library">
      <div class="gallery-grid ad-template-grid">
        <article class="gallery-card ad-template-card">
          <div class="ad-template-single ad-template-wide">
            <img src="assets/ad-template-1-02.png" alt="Advertising template #1" data-lightbox-image />
          </div>
          <h3>#1</h3>
        </article>

        <article class="gallery-card ad-template-card">
          <div class="ad-template-single">
            <img src="assets/ad-template-2-01.jpeg" alt="Advertising template #2" data-lightbox-image />
          </div>
          <h3>#2</h3>
        </article>

        <article class="gallery-card ad-template-card">
          <div class="ad-template-single">
            <img src="assets/ad-template-3-01.jpeg" alt="Advertising template #3" data-lightbox-image />
          </div>
          <h3>#3</h3>
        </article>

        <article class="gallery-card ad-template-card">
          <div class="ad-template-single">
            <img src="assets/ad-template-4-01.jpeg" alt="Advertising template #4" data-lightbox-image />
          </div>
          <h3>#4</h3>
        </article>
      </div>
    </section>

    <div class="image-viewer" id="image-viewer" aria-hidden="true">
      <div class="image-viewer__overlay" data-image-viewer-close></div>
      <section class="image-viewer__panel" role="dialog" aria-modal="true" aria-label="Template image viewer">
        <button class="image-viewer__close" type="button" data-image-viewer-close aria-label="Close image viewer">&times;</button>
        <div class="image-viewer__tools" aria-label="Zoom controls">
          <button type="button" data-image-zoom="out" aria-label="Zoom out">-</button>
          <button type="button" data-image-zoom="in" aria-label="Zoom in">+</button>
        </div>
        <div class="image-viewer__stage">
          <img src="" alt="" />
        </div>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
